<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Arrendamento Acessível (RSAA)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tema.css">
</head>
<body class="com-rua">
<div id="app"><p class="estado" id="estado">A carregar o simulador…</p></div>
<p class="versao" id="versao"></p>

<script type="module">
// O simulador não vem nesta página: é lido do Firestore (conteudo/simulador), aberto a todos, sem identificação.
import { db, local } from "/js/firebase.js";
import { VERSAO } from "/js/versao.js";
import { doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
$("versao").textContent = `v${VERSAO}${local ? " · local" : ""}`;

try {
  const cont = await getDoc(doc(db, "conteudo", "simulador"));
  if (!cont.exists()) throw new Error("O simulador ainda não foi publicado.");
  const c = cont.data();
  // Cada simulação calculada fica registada de forma anónima (sem nome, e-mail nem identificador), para estatísticas.
  // Não bloqueia o simulador: se a escrita falhar, o cálculo segue igual.
  window.guardarSimulacao = d => addDoc(collection(db, "simulacoes"), { ...d, versao: VERSAO, criadoEm: serverTimestamp() })
    .catch(e => console.warn("Simulação não registada:", e.code || e));
  const style = document.createElement("style");
  style.textContent = c.css;
  document.head.appendChild(style);
  if (c.titulo) document.title = c.titulo;
  $("app").innerHTML = c.html;
  const script = document.createElement("script");
  script.textContent = c.js;
  document.body.appendChild(script);
} catch (e) {
  console.error(e);
  $("estado").textContent = "Não foi possível carregar o simulador. Recarregue a página.";
}
</script>
</body>
</html>
